<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Alcancía -->
  <path d="M 120 280 
           C 120 220, 160 180, 220 180 
           L 220 160 
           L 260 160 
           L 260 180 
           C 320 180, 380 220, 380 280 
           L 380 340 
           C 380 360, 360 380, 340 380 
           L 340 400 
           L 300 400 
           L 300 380 
           L 220 380 
           L 220 400 
           L 180 400 
           L 180 380 
           C 160 380, 140 360, 140 340 
           Z" 
        fill="url(#grad)" 
        stroke="white" 
        stroke-width="8" 
        stroke-linejoin="round"/>
  
  <!-- Cola -->
  <path d="M 380 260 Q 410 250, 400 280 Q 390 310, 380 300" 
        fill="none" 
        stroke="white" 
        stroke-width="8" 
        stroke-linecap="round"/>
  
  <!-- Ojo -->
  <circle cx="200" cy="260" r="12" fill="white"/>
  
  <!-- Ranura para moneda -->
  <line x1="230" y1="175" x2="280" y2="175" 
        stroke="white" 
        stroke-width="6" 
        stroke-linecap="round"/>
  
  <!-- Moneda -->
  <ellipse cx="280" cy="140" rx="35" ry="45" 
           fill="#059669" 
           stroke="white" 
           stroke-width="6"
           transform="rotate(-15 280 140)"/>
  <ellipse cx="280" cy="140" rx="20" ry="30" 
           fill="none" 
           stroke="white" 
           stroke-width="3"
           transform="rotate(-15 280 140)"/>
</svg>
